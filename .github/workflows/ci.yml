name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install Pandoc
        run: |
          curl --fail --location --output /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
          echo "b419369915e0f3181be0afdb040ec8ecc6b70e72e5992652a0d83aed9e6bc109  /tmp/pandoc.deb" | sha256sum --check
          sudo dpkg --install /tmp/pandoc.deb
      - name: Unit tests
        run: python3 -m unittest discover
      - name: Repository checks
        run: python3 rosetta.py check
      - name: Whitespace checks
        run: git diff --check

  regeneration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install Pandoc
        run: |
          curl --fail --location --output /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
          echo "b419369915e0f3181be0afdb040ec8ecc6b70e72e5992652a0d83aed9e6bc109  /tmp/pandoc.deb" | sha256sum --check
          sudo dpkg --install /tmp/pandoc.deb
      - name: Regenerate Chapters 1–22
        run: python3 rosetta.py convert --from 1 --to 22
      - name: Require a reproducible tracked book
        run: git diff --exit-code -- rosetta-book

  agda-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install Agda 2.8.0
        uses: ./external/agda-unimath/.github/actions/setup-agda
        with:
          agda-version: '2.8.0'
      - name: Typecheck aggregate Chapters 1–22
        run: python3 rosetta.py typecheck-all
